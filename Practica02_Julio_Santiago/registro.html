<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registro de usuario en TecnoShop">
    <title>TecnoShop | Registro</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>TecnoShop</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="carrito.html">Carrito</a>
            <a href="login.html">Iniciar sesión</a>
            <a href="registro.html">Registrarse</a>
        </nav>
    </header>

    <main>
        <section class="formulario-contenedor">
            <h2>Crear cuenta</h2>
            <form id="formRegistro">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>

                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ingresa tu número de teléfono">

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required>

                <label for="confirmarPassword">Confirmar contraseña</label>
                <input type="password" id="confirmarPassword" name="confirmarPassword" placeholder="Repite tu contraseña" required>

                <label>
                    <input type="checkbox" required> Acepto los términos y condiciones
                </label>

                <button type="submit">Registrarme</button>
            </form>
            <p style="text-align: center; margin-top: 15px;">¿Ya tienes una cuenta? <a href="login.html">Iniciar sesión</a></p>
        </section>
    </main>

    <footer>
        <p>TecnoShop - Aplicaciones Web</p>
    </footer>

    <script src="js/auth.js"></script>
</body>
</html>
